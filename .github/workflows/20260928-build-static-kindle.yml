name: Build and Package Static NeoMutt for Kindle KPW1

on:
  workflow_dispatch: # Manual activation via the Actions interface tab

jobs:
  build-armv7-static:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4
      with:
        clean: true

    - name: Install Build Prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install -y make curl docbook-xsl xsltproc gettext tcl bzip2 ncurses-bin xz-utils

    - name: Fetch and Setup Dedicated Musl-ARM Cross Compiler (Bootlin Mirror)
      run: |
        P="https://"
        D_BOOTLIN="toolchains.bootlin.com"
        
        # Download the official stable Bootlin musl toolchain for ARMv7 architectures
        curl -Lo arm-musl-cross.tar.xz "${P}${D_BOOTLIN}/downloads/releases/toolchains/armv7-eabihf/tarballs/armv7-eabihf--musl--stable-2024.05-1.tar.xz"
        
        # Unpack the compiled cross-compiler suite directly into the active workspace run path
        tar -xf arm-musl-cross.tar.xz -C ${{ github.workspace }}
        echo "${{ github.workspace }}/armv7-eabihf--musl--stable-2024.05-1/bin" >> $GITHUB_PATH

    - name: Download Explicit Dependency Tarballs
      run: |
        P="https://"
        
        # Download ZLib source from fossils server distributions
        DOMAIN_ZLIB="zlib.net"
        curl -Lo zlib-1.3.1.tar.gz "${P}${DOMAIN_ZLIB}/fossils/zlib-1.3.1.tar.gz"
        
        # Download GNU source archives cleanly via mirrored endpoints
        DOMAIN_GNU="ftp.gnu.org"
        curl -Lo libiconv-1.17.tar.gz "${P}${DOMAIN_GNU}/pub/gnu/libiconv/libiconv-1.17.tar.gz"
        curl -Lo ncurses-6.4.tar.gz "${P}${DOMAIN_GNU}/pub/gnu/ncurses/ncurses-6.4.tar.gz"
        
        # Download OpenSSL source from core distribution nodes
        DOMAIN_SSL="www.openssl.org"
        curl -Lo openssl-1.1.1w.tar.gz "${P}${DOMAIN_SSL}/source/openssl-1.1.1w.tar.gz"

    - name: Extract Dependency Source Tree
      run: |
        mkdir -p "${{ github.workspace }}/dist"
        tar -xzf zlib-1.3.1.tar.gz
        tar -xzf libiconv-1.17.tar.gz
        tar -xzf openssl-1.1.1w.tar.gz
        tar -xzf ncurses-6.4.tar.gz

    - name: Build Static ZLib (Musl Toolchain)
      env:
        CC: arm-linux-gcc
        CFLAGS: "-static -O2"
      run: |
        cd zlib-1.3.1
        ./configure --prefix=${{ github.workspace }}/dist --static
        make -j$(nproc)
        make install

    - name: Build Static LibIconv (Musl Toolchain)
      env:
        CC: arm-linux-gcc
        CFLAGS: "-static -O2"
        LDFLAGS: "-static"
      run: |
        cd libiconv-1.17
        ./configure --host=arm-linux --prefix=${{ github.workspace }}/dist --enable-static --disable-shared
        make -j$(nproc)
        make install

    - name: Build Static OpenSSL (Musl Toolchain)
      env:
        CC: arm-linux-gcc
        CFLAGS: "-static -O2"
        LDFLAGS: "-static"
      run: |
        cd openssl-1.1.1w
        ./Configure linux-generic32 -static --prefix=${{ github.workspace }}/dist --openssldir=${{ github.workspace }}/dist/ssl no-shared no-async no-engine no-tests
        make -j$(nproc)
        make install_sw

    - name: Build Static NCurses (Musl Toolchain)
      env:
        CC: arm-linux-gcc
        CFLAGS: "-static -O2"
        LDFLAGS: "-static"
      run: |
        cd ncurses-6.4
        ./configure --host=arm-linux \
                    --prefix=${{ github.workspace }}/dist \
                    --with-shared=no \
                    --with-normal=yes \
                    --enable-static \
                    --without-ada \
                    --without-tests \
                    --without-debug \
                    --enable-widec
        make -j$(nproc)
        make install.libs

    - name: Cross-Compile Standalone NeoMutt Binary (True Musl Static)
      env:
        CC: arm-linux-gcc
        CFLAGS: "-static -O2 -D_GNU_SOURCE"
        CPPFLAGS: "-I${{ github.workspace }}/dist/include -I${{ github.workspace }}/dist/include/ncursesw"
        LDFLAGS: "-static -L${{ github.workspace }}/dist/lib"
      run: |
        ./configure --host=arm-linux \
                    --prefix=${{ github.workspace }}/dist \
                    --disable-nls \
                    --disable-doc \
                    --ssl \
                    --with-ssl=${{ github.workspace }}/dist \
                    --with-ui=ncurses \
                    --disable-idn2 \
                    --disable-notmuch \
                    --disable-sqlite \
                    --disable-lmdb \
                    --disable-gdbm
        
        sed -i 's/^LDFLAGS = /LDFLAGS = -static /' Makefile
        make clean || true
        make -j$(nproc)
        arm-linux-strip neomutt

    - name: Structure and Assemble Kindle Release Package
      run: |
        mkdir -p ${{ github.workspace }}/kindle_output/bin
        mkdir -p ${{ github.workspace }}/kindle_output/terminfo/x
        mkdir -p ${{ github.workspace }}/kindle_output/extensions/alpine_mail
        
        cp neomutt ${{ github.workspace }}/kindle_output/bin/neomutt
        cp /lib/terminfo/x/xterm ${{ github.workspace }}/kindle_output/terminfo/x/xterm
        
        cp kindle_assets/.muttrc ${{ github.workspace }}/kindle_output/.muttrc
        cp kindle_assets/run_mail.sh ${{ github.workspace }}/kindle_output/extensions/alpine_mail/run_mail.sh
        cp kindle_assets/config.xml ${{ github.workspace }}/kindle_output/extensions/alpine_mail/config.xml
        
        cat << 'EOF' > ${{ github.workspace }}/kindle_output/extensions/alpine_mail/menu.json
        {
          "items": [
            {
              "name": "Launch NeoMutt (Dark)",
              "priority": 1,
              "action": "/mnt/us/extensions/alpine_mail/run_mail.sh",
              "output": false
            }
          ]
        }
        EOF

    - name: Upload Complete Kindle Build Bundle
      uses: actions/upload-artifact@v4
      with:
        name: neomutt-kpw1-bundle
        path: ${{ github.workspace }}/kindle_output/
