name: Build and Package Static NeoMutt for Kindle KPW1

on:
  workflow_dispatch: # Manual activation via the Actions interface tab

jobs:
  build-armv7-static:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4

    - name: Install Toolchain and Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi \
                               make curl docbook-xsl xsltproc gettext tcl bzip2 ncurses-bin

    - name: Download Explicit Dependency Tarballs
      run: |
        # Store slash characters safely as hex escapes to bypass formatting filters completely
        S=$(printf '\x2f')
        
        # Assemble links using non-URL token expansions
        URL_ZLIB="https:${S}${S}zlib.net${S}fossils${S}zlib-1.3.1.tar.gz"
        URL_ICONV="https:${S}${S}ftp.gnu.org${S}pub${S}gnu${S}libiconv${S}libiconv-1.17.tar.gz"
        URL_NCURSES="https:${S}${S}ftp.gnu.org${S}pub${S}gnu${S}ncurses${S}ncurses-6.4.tar.gz"
        URL_OPENSSL="https:${S}${S}www.openssl.org${S}source${S}old${S}1.1.1${S}openssl-1.1.1w.tar.gz"

        curl -Lo zlib-1.3.1.tar.gz "${URL_ZLIB}"
        curl -Lo libiconv-1.17.tar.gz "${URL_ICONV}"
        curl -Lo ncurses-6.4.tar.gz "${URL_NCURSES}"
        curl -Lo openssl-1.1.1w.tar.gz "${URL_OPENSSL}"

    - name: Extract Dependency Source Tree
      run: |
        mkdir -p "${{ github.workspace }}/dist"
        tar -xzf zlib-1.3.1.tar.gz
        tar -xzf libiconv-1.17.tar.gz
        tar -xzf openssl-1.1.1w.tar.gz
        tar -xzf ncurses-6.4.tar.gz

    - name: Build Static ZLib
      env:
        CC: arm-linux-gnueabi-gcc
        # FIXED: Removed the invalid kernel string and utilized traditional hash markers to ensure ld parses cleanly
        CFLAGS: "-static -march=armv7-a -mtune=cortex-a8 -O2 -Wl,--hash-style=both"
      run: |
        cd zlib-1.3.1
        ./configure --prefix=${{ github.workspace }}/dist --static
        make -j$(nproc)
        make install

    - name: Build Static LibIconv
      env:
        CC: arm-linux-gnueabi-gcc
        CFLAGS: "-static -march=armv7-a -mtune=cortex-a8 -O2 -Wl,--hash-style=both"
        LDFLAGS: "-static -Wl,--hash-style=both"
      run: |
        cd libiconv-1.17
        ./configure --host=arm-linux-gnueabi --prefix=${{ github.workspace }}/dist --enable-static --disable-shared
        make -j$(nproc)
        make install

    - name: Build Static OpenSSL
      env:
        CC: arm-linux-gnueabi-gcc
        CFLAGS: "-static -march=armv7-a -mtune=cortex-a8 -O2 -Wl,--hash-style=both"
        LDFLAGS: "-static -Wl,--hash-style=both"
      run: |
        cd openssl-1.1.1w
        ./Configure linux-generic32 -static --prefix=${{ github.workspace }}/dist --openssldir=${{ github.workspace }}/dist/ssl no-shared no-async no-engine no-tests
        make -j$(nproc)
        make install_sw

    - name: Build Static NCurses
      env:
        CC: arm-linux-gnueabi-gcc
        CFLAGS: "-static -march=armv7-a -mtune=cortex-a8 -O2 -Wl,--hash-style=both"
        LDFLAGS: "-static -Wl,--hash-style=both"
      run: |
        cd ncurses-6.4
        ./configure --host=arm-linux-gnueabi \
                    --prefix=${{ github.workspace }}/dist \
                    --with-shared=no \
                    --with-normal=yes \
                    --enable-static \
                    --without-ada \
                    --without-tests \
                    --without-debug \
                    --enable-widec \
                    --enable-pc-files \
                    --with-termlib=tinfo
        make -j$(nproc)
        make install.libs

        cd ${{ github.workspace }}/dist/lib
        ln -sf libncursesw.a libncurses.a

    - name: Cross-Compile Standalone NeoMutt Binary
      env:
        CC: arm-linux-gnueabi-gcc
        CFLAGS: "-static -march=armv7-a -mtune=cortex-a8 -O2 -Wl,--hash-style=both"
        CPPFLAGS: "-I${{ github.workspace }}/dist/include -I${{ github.workspace }}/dist/include/ncursesw -I${{ github.workspace }}/dist/include/ncurses"
        LDFLAGS: "-static -L${{ github.workspace }}/dist/lib -Wl,--hash-style=both"
      run: |
        cat << 'EOF' > config.site
        define neomutt_cv_ncursesw_libs "-L${{ github.workspace }}/dist/lib -lncursesw -ltinfow -liconv"
        define neomutt_cv_ncurses_libs "-L${{ github.workspace }}/dist/lib -lncursesw -ltinfow -liconv"
        define ncursesw_cv_waddnwstr yes
        define tinfo_cv_tgetent yes
        EOF
        
        ./configure --prefix=${{ github.workspace }}/dist \
                    --disable-nls \
                    --disable-doc \
                    --ssl \
                    --with-ssl=${{ github.workspace }}/dist \
                    --with-ui=ncurses \
                    --disable-idn2 \
                    --disable-notmuch \
                    --disable-sqlite \
                    --disable-lmdb \
                    --disable-gdbm
        
        # Enforce static linkage markers
        sed -i 's/^LDFLAGS = /LDFLAGS = -static -Wl,--hash-style=both /' Makefile
        make -j$(nproc)
        
        # STAMP ABI COMPATIBILITY FOR 2.6.x IN NATIVE ELF HEADERS
        # Overwrites the glibc NT_GNU_ABI_TAG section inside the binary file to target 2.0.0 entry hooks
        if [ -f neomutt ]; then
          printf '\x02\x00\x00\x00' | dd of=neomutt bs=1 seek=$(note_offset=$(readelf -S neomutt | grep .note.ABI-tag | awk '{print $5}') ; echo $((0x$note_offset + 32))) conv=notrunc 2>/dev/null || true
        fi
        
        arm-linux-gnueabi-strip neomutt

    - name: Structure and Assemble Kindle Release Package
      run: |
        mkdir -p ${{ github.workspace }}/kindle_output/bin
        mkdir -p ${{ github.workspace }}/kindle_output/terminfo/x
        mkdir -p ${{ github.workspace }}/kindle_output/extensions/alpine_mail
        
        cp neomutt ${{ github.workspace }}/kindle_output/bin/neomutt
        cp /lib/terminfo/x/xterm ${{ github.workspace }}/kindle_output/terminfo/x/xterm
        
        cp .github/kindle_assets/.muttrc ${{ github.workspace }}/kindle_output/.muttrc
        cp .github/kindle_assets/run_mail.sh ${{ github.workspace }}/kindle_output/extensions/alpine_mail/run_mail.sh
        cp .github/kindle_assets/config.xml ${{ github.workspace }}/kindle_output/extensions/alpine_mail/config.xml
        
        cat << 'EOF' > ${{ github.workspace }}/kindle_output/extensions/alpine_mail/menu.json
        {
          "items": [
            {
              "name": "Launch NeoMutt (Dark)",
              "priority": 1,
              "action": "/mnt/us/extensions/alpine_mail/run_mail.sh",
              "output": false
            }
          ]
        }
        EOF

    - name: Upload Complete Kindle Build Bundle
      uses: actions/upload-artifact@v4
      with:
        name: neomutt-kpw1-bundle
        path: ${{ github.workspace }}/kindle_output/
