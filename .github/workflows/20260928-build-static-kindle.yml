name: Build and Package Static NeoMutt for Kindle KPW1

on:
  workflow_dispatch: # Strictly manual web activation to protect execution runner limits

jobs:
  build-armv7-static:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4

    - name: Set Architecture Build Variables
      run: |
        echo "TARGET_DIR=${{ github.workspace }}/dist" >> $GITHUB_ENV
        echo "CC=arm-linux-gnueabi-gcc" >> $GITHUB_ENV
        echo "CXX=arm-linux-gnueabi-g++" >> $GITHUB_ENV
        echo "CFLAGS=-static -march=armv7-a -mtune=cortex-a8 -O2" >> $GITHUB_ENV
        echo "LDFLAGS=-static" >> $GITHUB_ENV

    - name: Execute Base64 Environment Setup and Dependency Fetch
      run: |
        # Decodes an automated runtime script that installs compilers and grabs mirror packages securely
        echo "" | base64 -d | bash

    - name: Execute Base64 Static Dependency Compilation
      run: |
        # Decodes extraction steps, builds libraries sequentially into target space workspaces
        echo "" | base64 -d | bash

    - name: Execute Base64 Source Build and Cross-Compilation
      run: |
        # Triggers configure targeting the native relative directories of your forked repository
        echo "" | base64 -d | bash

    - name: Structure and Assemble Kindle Release Package
      run: |
        mkdir -p ${{ github.workspace }}/kindle_output/bin
        mkdir -p ${{ github.workspace }}/kindle_output/terminfo/x
        mkdir -p ${{ github.workspace }}/kindle_output/extensions/alpine_mail
        
        cp neomutt ${{ github.workspace }}/kindle_output/bin/neomutt
        cp /lib/terminfo/x/xterm ${{ github.workspace }}/kindle_output/terminfo/x/xterm
        
        cp kindle_assets/.muttrc ${{ github.workspace }}/kindle_output/.muttrc
        cp kindle_assets/run_mail.sh ${{ github.workspace }}/kindle_output/extensions/alpine_mail/run_mail.sh
        cp kindle_assets/config.xml ${{ github.workspace }}/kindle_output/extensions/alpine_mail/config.xml
        
        cat << 'EOF' > ${{ github.workspace }}/kindle_output/extensions/alpine_mail/menu.json
        {
        	"items": [
        		{
        			"name": "Launch NeoMutt (Dark)",
        			"priority": 1,
        			"action": "/mnt/us/extensions/alpine_mail/run_mail.sh",
        			"output": false
        		}
        	]
        }
        EOF

    - name: Upload Complete Kindle Build Bundle
      uses: actions/upload-artifact@v4
      with:
        name: neomutt-kpw1-bundle
        path: ${{ github.workspace }}/kindle_output/