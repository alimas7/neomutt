name: Build and Package Static NeoMutt for Kindle KPW1

on:
  workflow_dispatch:

jobs:
  build-armv7-static:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4

    - name: Install Cross-Compilation Prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi \
                               make curl docbook-xsl xsltproc gettext tcl bzip2 ncurses-bin

    - name: Download Static Dependencies
      run: |
        curl -LO https://openssl.org
        curl -LO https://gnu.org
        curl -LO https://gnu.org
        curl -LO https://zlib.net

    - name: Extract Dependencies
      run: |
        tar -xzf openssl-1.1.1w.tar.gz
        tar -xzf ncurses-6.4.tar.gz
        tar -xzf libiconv-1.17.tar.gz
        tar -xzf zlib-1.3.1.tar.gz

    - name: Set Architecture Build Variables
      run: |
        echo "TARGET_DIR=${{ github.workspace }}/dist" >> $GITHUB_ENV
        echo "CC=arm-linux-gnueabi-gcc" >> $GITHUB_ENV
        echo "CXX=arm-linux-gnueabi-g++" >> $GITHUB_ENV
        echo "CFLAGS=-static -march=armv7-a -mtune=cortex-a8 -O2" >> $GITHUB_ENV
        echo "LDFLAGS=-static" >> $GITHUB_ENV

    - name: Build Static ZLib
      run: |
        cd zlib-1.3.1 && ./configure --prefix=$TARGET_DIR --static && make -j$(nproc) && make install

    - name: Build Static LibIconv
      run: |
        cd libiconv-1.17 && ./configure --host=arm-linux-gnueabi --prefix=$TARGET_DIR --enable-static --disable-shared && make -j$(nproc) && make install

    - name: Build Static OpenSSL
      run: |
        cd openssl-1.1.1w
        ./Configure linux-generic32 -static --prefix=$TARGET_DIR --openssldir=$TARGET_DIR/ssl no-shared no-async no-engine no-tests
        make -j$(nproc) && make install_sw

    - name: Build Static NCurses
      run: |
        cd ncurses-6.4
        ./configure --host=arm-linux-gnueabi --prefix=$TARGET_DIR --with-shared=no --with-normal=yes --enable-static --without-ada --without-tests --without-debug --enable-widec
        make -j$(nproc) && make install

    - name: Compile Forked Source Build
      run: |
        ./configure --prefix=$TARGET_DIR \
                    --disable-nls --disable-doc \
                    --ssl --with-ssl=$TARGET_DIR \
                    --with-curses=$TARGET_DIR \
                    --with-ui=ncurses \
                    --disable-idn2 --disable-notmuch --disable-sqlite \
                    --disable-lmdb --disable-gdbm
        
        sed -i 's/^LDFLAGS = /LDFLAGS = -static /' Makefile
        make -j$(nproc)

    - name: Structure and Assemble Kindle Release Package
      run: |
        mkdir -p ${{ github.workspace }}/kindle_output/bin
        mkdir -p ${{ github.workspace }}/kindle_output/terminfo/x
        mkdir -p ${{ github.workspace }}/kindle_output/extensions/alpine_mail
        
        cp neomutt ${{ github.workspace }}/kindle_output/bin/neomutt
        cp /lib/terminfo/x/xterm ${{ github.workspace }}/kindle_output/terminfo/x/xterm
        
        cp kindle_assets/.muttrc ${{ github.workspace }}/kindle_output/.muttrc
        cp kindle_assets/run_mail.sh ${{ github.workspace }}/kindle_output/extensions/alpine_mail/run_mail.sh
        cp kindle_assets/config.xml ${{ github.workspace }}/kindle_output/extensions/alpine_mail/config.xml
        
        cat << 'EOF' > ${{ github.workspace }}/kindle_output/extensions/alpine_mail/menu.json
        {
        	"items": [
        		{
        			"name": "Launch NeoMutt (Dark)",
        			"priority": 1,
        			"action": "/mnt/us/extensions/alpine_mail/run_mail.sh",
        			"output": false
        		}
        	]
        }
        EOF

    - name: Upload Complete Kindle Build Bundle
      uses: actions/upload-artifact@v4
      with:
        name: neomutt-kpw1-bundle
        path: ${{ github.workspace }}/kindle_output/