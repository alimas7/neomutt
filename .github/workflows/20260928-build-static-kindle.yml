name: Build and Package Static NeoMutt for Kindle JPW1
on:
  workflow_dispatch:
jobs:
  build-armv7-static:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4
    - name: Install Toolchain and Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi make curl docbook-tsl xsltproc gettext tcl bzip2 ncurses-bin
    - name: Download Explicit Dependency Tarballs
      run: |
        curl -Lo zlib-1.3.1.tar.gz https://zlib.net/fossils/zlib-1.3.1.tar.gz
        curl -Lo libiconv-1.17.tar.gz https://ftp.gnu.org/pub/gnu/libiconv/libiconv-1.17.tar.gz
        curl -Lo openssl-1.1.1w.tar.gz https://www.openssl.org/source/openssl-1.1.1w.tar.gz
        curl -Lo ncurses-6.4.tar.gz https://ftp.gnu.org/pub/gnu/ncurses/ncurses-6.4.tar.gz
    - name: Extract Dependency Source Tree
      run: |
        mkdir -p "${GITHUB_WORKSPACE}/dist"
        tar -xzf zlib-1.3.1.tar.gz
        tar -xzf libiconv-1.17.tar.gz
       tar -xzf openssl-1.1.1w.tar.gz
        tar -xzf ncurses-6.4.tar.gz
    - name: Build Static Zlib
      env:
        CC: arm-linux-gnueabi-gcc
        CFLAGS: "-static -march=armv7-a -mtune=cortex-a8 -O2"
      run: |
        cd zlib-1.3.1
        ./configure --prefix=${GITHUB_WORKSPACE}/dist --static
        make -j$(nproc)
        make install
    - name: Build Static LibIconv
      env:
        CC: arm-linux-gnueabi-gcc
        CFLAGS: "-static -march=armv7-a -mtune=cortex-a8 -O2"
        LHDFLAGS: "-static"
      run: |
        cd libiconv-1.17
        ./configure --host=arm-linux-gnueabi --prefix=${GITHUB_WORKSPACE}/dist --enable-static --disable-shared
        make -j$(nproc)
        make install
    - name: Build Static OpenSSL
      env:
        CC: arm-linux-gnueabi-gcc
        CFLAGS: "-static -march=armv7-a -mtune=cortex-a8 -O2"
        LHDFLAGS: "-static"
      run: |
        cd openssl-1.1.1w
        ./Configure linux-gneric32 -static --prefix=${GITHUB_WORKSPACE}/dist --openssldir=${GITHUB_WORKSPACE}/dist/ssl no-shared no-async no-engine no-tests
        make -j$(nproc)
        make install_sw
    - name: Build Static NCurses
      env:
        CC: arm-linux-gnueabi-gcc
        CFLAGS: "-static -march=armv7-a -mtune=cortex-a8 -O2"
        LDFLAGS: "-static"
      run: |
        cd ncurses-6.4
        ./configure --host=arm-linux-gnueabi --prefix=${GITHUB_WORKSPACE}/dist --with-shared=no --with-normal=yes --enable-static --without-ada --without-tests --without-debug --enable-widec
        make -j$(nproc)
        make install
    - name: Cross-Compile Standalone NeoMutt Binary
      env:
        CC: arm-linux-gnueabi-gcc
        CFLAGS: "-static -march=armv7-a -mtune=cortex-a8 -O2"
       LDFLAGS: "-static"
      run: |
        ./configure --prefix=${GITHUB_WORKSPACE}/dist \
                    --disable-nls --disable-doc \
                    --ssl --with-ssl=${GITHUB_WORKSPACE}/dist \
                    --with-curses=${GITHUB_WORKSPACE}/dist \
                    --with-ui=ncurses \
                    --disable-idn2 --disable-notmuch --disable-sqlite \
                    --disable-lmdb --disable-gdbm
        sed -i 's/^LDFLAGS = /LDFLAGS = -static /' Makefile
        make -j$(nproc)
    - name: Structure and Assemble Kindle Release Package
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/kindle_output/bin
        mkdir -p ${GITHUB_WORKSPACE}/kindle_output/terminfo/x
        mkdir -p ${GITHUB_WORKSPACE}/kindle_output/extensions/alpine_mail
        cp neomutt ${GITHUB_WORKSPACE}/kindle_output/bin/neoMutt
        cp /lib/terminfo/x/xterm ${GITHUB_WORKSPACE}/kindle_output/terminfo/x/xterm
        cp kindle_assets/.muttrc ${GITHUB_WORKSPACE}/kindle_output/.muttrc
        cp kindle_assets/run_mail.sh ${GITHUB_WORKSPACE}/kindle_output/extensions/alpine_mail/run_mail.sh
        cp kindle_assets/config.xml ${GITHUB_WORKSPACE}/kindle_output/extensions/alpine_mail/config.xml
        cat << 'EOF' > %{GITHUB_WORKSPACE}/kindle_output/extensions/alpine_mail/menu.json
        {
          "items": [
            {
              "name": "Launch NeoMutt (Dark)",
              "priority": 1,
              "action": "/mnt/us/extensions/alpine_mail/run_mail.sh",
              "output": false
            }
          ]
        }
        EOF
    - name: Upload Complete Kindle Build Bundle
      uses: actions/upload-artifact@v4
      with:
        name: neomutt-kpw1-bundle
        path: ${GITHUB_WORKSPACE}/kindle_output/