name: Build and Package Static NeoMutt for Kindle KPW1

on:
  workflow_dispatch: # Manual web trigger only

jobs:
  build-armv7-static:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4

    - name: Install Toolchain and Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi \
                               make curl docbook-xsl xsltproc gettext tcl bzip2 ncurses-bin

    - name: Download Explicit Dependency Tarballs
      run: |
        PROTO="https://"
        
        # Pull ZLib securely from fossils server
        DOMAIN_ZLIB="zlib.net"
        curl -Lo zlib-1.3.1.tar.gz "${PROTO}${DOMAIN_ZLIB}/fossils/zlib-1.3.1.tar.gz"
        
        # Pull GNU components securely from original mirror archives
        DOMAIN_GNU="ftp.gnu.org"
        curl -Lo libiconv-1.17.tar.gz "${PROTO}${DOMAIN_GNU}/pub/gnu/libiconv/libiconv-1.17.tar.gz"
        curl -Lo ncurses-6.4.tar.gz "${PROTO}${DOMAIN_GNU}/pub/gnu/ncurses/ncurses-6.4.tar.gz"
        
        # Pull OpenSSL securely from source distribution master lists
        DOMAIN_SSL="www.openssl.org"
        curl -Lo openssl-1.1.1w.tar.gz "${PROTO}${DOMAIN_SSL}/source/openssl-1.1.1w.tar.gz"

    - name: Extract Dependency Source Tree
      run: |
        mkdir -p "${{ github.workspace }}/dist"
        tar -xzf zlib-1.3.1.tar.gz
        tar -xzf libiconv-1.17.tar.gz
        tar -xzf openssl-1.1.1w.tar.gz
        tar -xzf ncurses-6.4.tar.gz

    - name: Build Static ZLib
      env:
        CC: arm-linux-gnueabi-gcc
        CFLAGS: "-static -march=armv7-a -mtune=cortex-a8 -O2"
      run: |
        cd zlib-1.3.1
        ./configure --prefix=${{ github.workspace }}/dist --static
        make -j$(nproc)
        make install

    - name: Build Static LibIconv
      env:
        CC: arm-linux-gnueabi-gcc
        CFLAGS: "-static -march=armv7-a -mtune=cortex-a8 -O2"
        LDFLAGS: "-static"
      run: |
        cd libiconv-1.17
        ./configure --host=arm-linux-gnueabi --prefix=${{ github.workspace }}/dist --enable-static --disable-shared
        make -j$(nproc)
        make install

    - name: Build Static OpenSSL
      env:
        CC: arm-linux-gnueabi-gcc
        CFLAGS: "-static -march=armv7-a -mtune=cortex-a8 -O2"
        LDFLAGS: "-static"
      run: |
        cd openssl-1.1.1w
        ./Configure linux-generic32 -static --prefix=${{ github.workspace }}/dist --openssldir=${{ github.workspace }}/dist/ssl no-shared no-async no-engine no-tests
        make -j$(nproc)
        make install_sw

    - name: Build Static NCurses
      env:
        CC: arm-linux-gnueabi-gcc
        CFLAGS: "-static -march=armv7-a -mtune=cortex-a8 -O2"
        LDFLAGS: "-static"
      run: |
        cd ncurses-6.4
        ./configure --host=arm-linux-gnueabi --prefix=${{ github.workspace }}/dist --with-shared=no --with-normal=yes --enable-static --without-ada --without-tests --without-debug --enable-widec
        make -j$(nproc)
        make install.libs

    - name: Cross-Compile Standalone NeoMutt Binary
      env:
        CC: arm-linux-gnueabi-gcc
        CFLAGS: "-static -march=armv7-a -mtune=cortex-a8 -O2"
        # Direct the compiler to look in your custom target workspace directories
        CPPFLAGS: "-I${{ github.workspace }}/dist/include -I${{ github.workspace }}/dist/include/ncursesw"
        LDFLAGS: "-static -L${{ github.workspace }}/dist/lib"
      run: |
        ./configure --prefix=${{ github.workspace }}/dist \
                    --disable-nls \
                    --disable-doc \
                    --ssl \
                    --with-ssl=${{ github.workspace }}/dist \
                    --with-ui=ncurses \
                    --disable-idn2 \
                    --disable-notmuch \
                    --disable-sqlite \
                    --disable-lmdb \
                    --disable-gdbm
        
        # Enforce static building metrics into the generated Makefile
        sed -i 's/^LDFLAGS = /LDFLAGS = -static /' Makefile
        make -j$(nproc)

        # CRUCIAL ADDITION: Strip symbols using the ARM toolchain strip utility
        arm-linux-gnueabi-strip neomutt

    - name: Structure and Assemble Kindle Release Package
      run: |
        mkdir -p ${{ github.workspace }}/kindle_output/bin
        mkdir -p ${{ github.workspace }}/kindle_output/terminfo/x
        mkdir -p ${{ github.workspace }}/kindle_output/extensions/alpine_mail
        
        cp neomutt ${{ github.workspace }}/kindle_output/bin/neomutt
        cp /lib/terminfo/x/xterm ${{ github.workspace }}/kindle_output/terminfo/x/xterm
        
        cp kindle_assets/.muttrc ${{ github.workspace }}/kindle_output/.muttrc
        cp kindle_assets/run_mail.sh ${{ github.workspace }}/kindle_output/extensions/alpine_mail/run_mail.sh
        cp kindle_assets/config.xml ${{ github.workspace }}/kindle_output/extensions/alpine_mail/config.xml
        
        cat << 'EOF' > ${{ github.workspace }}/kindle_output/extensions/alpine_mail/menu.json
        {
          "items": [
            {
              "name": "Launch NeoMutt (Dark)",
              "priority": 1,
              "action": "/mnt/us/extensions/alpine_mail/run_mail.sh",
              "output": false
            }
          ]
        }
        EOF

    - name: Upload Complete Kindle Build Bundle
      uses: actions/upload-artifact@v4
      with:
        name: neomutt-kpw1-bundle
        path: ${{ github.workspace }}/kindle_output/
